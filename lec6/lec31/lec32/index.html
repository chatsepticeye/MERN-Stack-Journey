<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border_box;
        }
        body{
            height:100%;
            width:100%;
        }
        .container{
            background-color: antiquewhite;
            padding:5rem;
            display:grid;
            gap:1rem;
            grid-template-columns: repeat(3,1fr);

        }
        .item{
            padding:2rem;
            
            height:100px;
            width:100px;
            background-color: rgb(58, 186, 32);
            border:2px solid black;

        }
        #rotateX:hover{
            transform:rotateX(45deg);
        }
        #rotateY:hover{
            transform:rotateY(45deg);
        }
        #rotateZ:hover{
            transform:rotateZ(45deg);
        }
        #translateX:hover{
            transform:translateX(100px);
        }
        #translateY:hover{
            transform:translateY(100px);
        }
        #translateZ:hover{
            transform:perspective(300px) translateZ(100px);
        }
        #scaleX:hover{
            transform:scaleX(1.5);
        }
         #scaleY:hover{
            transform:skewY(40deg);
        }
         #scaleZ:hover{
            transform:perspective(300px) scaleZ(1.5) rotateY(45deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="rotateX">RotateX</div>
        <div class="item" id="rotateY">RotateY</div>
        <div class="item" id="rotateZ">RotateZ</div>
        <div class="item" id="translateX">TranslateX</div>
        <div class="item" id="translateY">TranslateY</div>
        <div class="item" id="translateZ">TranslateZ</div>
        <div class="item" id="scaleX">ScaleX</div>
        <div class="item" id="scaleY">ScaleY</div>
        <div class="item" id="scaleZ">ScaleZ</div>
    </div>
    
</body>
</html>
